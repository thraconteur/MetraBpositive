# Findings that depend on today's date (expiry) are scored as of this day.
as_of: 2026-09-28

# What is actually printed on each real photo, read by eye from the image.
#
# value      - what extraction must return (numbers compared with a small
#              tolerance, text by case-insensitive containment)
# present    - the declaration is printed and legible on this photo; the
#              system should find it (the exact wording is not scored)
# not_legible- printed, but not readable in this photo (curved bottle,
#              cropped, glare). The system must NOT call it missing - it
#              should say INDETERMINATE. Not counted for or against reading.
# not_on_panel - not on the panel in this photo. Same rule as not_legible.
#
# expected_violations: rule ids a careful human WOULD flag on this photo.
#              The eval reports them as caught / not caught.
# possible_violations: rule ids where a human could argue either way
#              ("Incl GST" instead of "inclusive of all taxes", a blank
#              "Packed on" box that may be stamped on another face). Not
#              counted as false violations, not required either.
# Any OTHER violation the system reports is a false violation.
#
# OCR for photo1, photo2 and photo5 is real PaddleOCR 3.7 output from a
# teammate's machine: *.paddle.json = the photo as taken (the default),
# *.enhanced.paddle.json = after our deglare/contrast/sharpen pass.
# The extraction fixes of Sept 2026 were made looking at THESE three
# photos. photo3, photo4 and photo6-17 were read on a teammate's laptop
# (PaddleOCR 3.7, CPU) on 27-28 Sept 2026 and scored BEFORE any fix:
# 18/36 read correctly, 3 wrongly, 7 false violations, 2/2 caught. They were
# then used for fixes too, so none of the 17 is held out any more.

